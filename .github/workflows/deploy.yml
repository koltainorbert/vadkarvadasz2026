name: Deploy to FTP

on:
  push:
    branches:
      - main

jobs:
  deploy-plugin:
    name: Deploy Plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload Plugin via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: wp-plugin/vadaszapro-core/
          server-dir: ${{ secrets.FTP_PLUGIN_PATH }}/vadaszapro-core/

  deploy-theme:
    name: Deploy Theme
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload Theme via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: wp-theme/vadaszapro-theme/
          server-dir: ${{ secrets.FTP_THEME_PATH }}/
