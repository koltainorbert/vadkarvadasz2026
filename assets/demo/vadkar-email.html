<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Email előnézet – Vadkár Vadász</title>
<style>
  body { margin:0; background:#1a1a1a; font-family:system-ui,-apple-system,Segoe UI,sans-serif; }
  .section-label { padding:28px 24px 6px; font-size:11px; font-weight:700; color:rgba(255,255,255,.3); letter-spacing:1.5px; text-transform:uppercase; }
  .tabs { display:flex; gap:0; flex-wrap:wrap; padding:0 24px 0; }
  .tab { padding:10px 18px; cursor:pointer; font-size:13px; font-weight:700; border-radius:8px 8px 0 0;
         background:#2a2a2a; color:rgba(255,255,255,.5); border:1px solid #333; border-bottom:none; margin-right:2px; }
  .tab.active { background:#111; color:#fff; border-color:#444; }
  .preview-area { padding:0 24px 32px; }
  iframe { width:100%; height:700px; border:none; border-radius:0 8px 8px 8px;
           background:#f4f4f5; display:none; }
  iframe.active { display:block; }
  .label-30 { color:#ffd700; }
  .label-7  { color:#ffaa00; }
  .label-1  { color:#ff4444; }
  .label-exp{ color:#cc0000; }
  .label-admin{ color:#00aaff; }
</style>
</head>
<body>

<div class="section-label">📭 Hirdetés törlési figyelmeztetések</div>
<div class="tabs">
  <div class="tab active label-30" onclick="show(0)">🟡 30 napos (hirdetés)</div>
  <div class="tab label-7"  onclick="show(1)">🟠 7 napos (hirdetés)</div>
  <div class="tab label-1"  onclick="show(2)">🔴 1 napos (hirdetés)</div>
</div>
<div class="section-label">🏷️ Csomag lejárat figyelmeztetések</div>
<div class="tabs">
  <div class="tab label-30" onclick="show(3)">🟡 30 nap – csomag lejár</div>
  <div class="tab label-7"  onclick="show(4)">🟠 7 nap – csomag lejár</div>
  <div class="tab label-1"  onclick="show(5)">🔴 Holnap lejár</div>
  <div class="tab label-exp" onclick="show(6)">⛔ Csomag lejárt (user)</div>
  <div class="tab label-admin" onclick="show(7)">🔵 Admin értesítő</div>
</div>
<div class="preview-area">
  <iframe id="f0" class="active" srcdoc=""></iframe>
  <iframe id="f1" srcdoc=""></iframe>
  <iframe id="f2" srcdoc=""></iframe>
  <iframe id="f3" srcdoc=""></iframe>
  <iframe id="f4" srcdoc=""></iframe>
  <iframe id="f5" srcdoc=""></iframe>
  <iframe id="f6" srcdoc=""></iframe>
  <iframe id="f7" srcdoc=""></iframe>
</div>

<script>
function show(n){
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',i===n));
  document.querySelectorAll('iframe').forEach((f,i)=>f.classList.toggle('active',i===n));
}

const SITE  = 'Vadkár Vadász';
const SITE_URL = '#';
const CONTACT = 'vadkarvadasz@gmail.com';
const BUY_URL = '#';
const LOGO_URL = 'https://vadkarvadasz.hu/wp-content/uploads/va-users/1/avatar/vadkarkozepesfiok.png';
const YEAR = new Date().getFullYear();

const LISTINGS = [
  'Browning B525 sörétes puska, 12/76',
  'Leupold VX-3i 3-9×40 távcső',
  'Swarovski EL 8×32 binokulár',
];

function logoBlock(){
  if (LOGO_URL && LOGO_URL.trim() !== '') {
    return `<span style="display:inline-flex;align-items:center;gap:14px;">
      <img src="${LOGO_URL}" alt="${SITE}" height="88" style="height:88px;width:auto;display:block;border-radius:8px;">
      <span style="font-size:42px;font-weight:800;line-height:1;color:#ffffff;letter-spacing:-0.5px;">${SITE}</span>
    </span>`;
  }
  return `<span style="font-size:24px;font-weight:800;color:#ffffff;letter-spacing:-0.5px;">${SITE}</span>`;
}

function listingList(){
  return `<ul style="margin:12px 0 0;padding-left:20px;">${LISTINGS.map(t=>`<li style="margin:4px 0;color:#374151;">${t}</li>`).join('')}</ul>`;
}

function contactBox(){
  return `<p style="margin:20px 0 0;padding:12px 16px;background:#f9f9f9;border-left:3px solid #cc0000;border-radius:4px;font-size:13px;color:#6b7280;">
    Ha bármilyen kérdésed van, keress minket: <a href="mailto:${CONTACT}" style="color:#cc0000;">${CONTACT}</a>
  </p>`;
}

function build(heading, bodyHtml, btnLabel){
  return `<!DOCTYPE html><html lang="hu"><head><meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>${heading}</title></head>
  <body style="margin:0;padding:0;background:#f4f4f5;font-family:system-ui,-apple-system,Segoe UI,sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#f4f4f5;padding:32px 0;">
    <tr><td align="center">
      <table width="600" cellpadding="0" cellspacing="0" border="0" style="max-width:600px;width:100%;">
        <tr>
          <td style="background:linear-gradient(135deg,#0a0a0a 0%,#1a1a1a 100%);border-radius:12px 12px 0 0;padding:24px 32px;text-align:center;">
            <a href="${SITE_URL}" style="text-decoration:none;">${logoBlock()}</a>
          </td>
        </tr>
        <tr>
          <td style="background:#ffffff;padding:36px 40px 28px;border-left:1px solid #e5e5e5;border-right:1px solid #e5e5e5;">
            <h1 style="margin:0 0 20px;font-size:22px;font-weight:800;color:#0a0a0a;line-height:1.3;">${heading}</h1>
            <div style="font-size:15px;line-height:1.7;color:#374151;">${bodyHtml}</div>
            <div style="text-align:center;margin:28px 0 8px;">
              <a href="${BUY_URL}" style="display:inline-block;background:#cc0000;color:#ffffff;text-decoration:none;font-size:15px;font-weight:700;padding:14px 32px;border-radius:8px;letter-spacing:0.3px;">${btnLabel}</a>
            </div>
          </td>
        </tr>
        <tr>
          <td style="background:#0a0a0a;border-radius:0 0 12px 12px;padding:20px 32px;text-align:center;">
            <p style="margin:0;font-size:12px;color:rgba(255,255,255,0.45);">
              © ${YEAR} <a href="${SITE_URL}" style="color:rgba(255,255,255,0.6);text-decoration:none;">${SITE}</a> &bull; Ezt az emailt automatikusan küldte a rendszer.
            </p>
          </td>
        </tr>
      </table>
    </td></tr>
  </table></body></html>`;
}

// 30 napos
document.getElementById('f0').srcdoc = build(
  '3 hirdetésed 30 nap múlva törlődhet',
  `<p style="margin:0 0 14px;">Kedves <strong>Nagy János</strong>,</p>
   <p style="margin:0 0 14px;">Tájékoztatunk, hogy az alábbi, csomaglimit miatt szüneteltetett hirdetéseid
   <strong>2026. június 10.</strong>-ig törlésre kerülnek, amennyiben addig nem frissíted előfizetésedet:</p>
   ${listingList()}
   <p style="margin:14px 0 0;">Még bőven van idő, de érdemes időben gondoskodni a megújításról.</p>
   ${contactBox()}`,
  '📦 Előfizetési csomagok'
);

// 7 napos

   (legkorábban <strong>2026. május 18.</strong>) törlődnek az alábbi, csomaglimit miatt szüneteltetett hirdetéseid:</p>

// 1 napos
document.getElementById('f2').srcdoc = build(

   <p style="margin:0 0 14px;">Ez az <strong style="color:#cc0000;">utolsó figyelmeztetés</strong>.

   ${listingList()}

  '🔓 Csomag frissítése most'

/* ── CSOMAG LEJÁRAT EMAILEK ─────────────────────────────────── */

function buildPlanWarning(heading, bodyHtml, btnLabel, btnUrl){
  return `<!DOCTYPE html><html lang="hu"><head><meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>${heading}</title></head>
  <body style="margin:0;padding:0;background:#f4f4f5;font-family:system-ui,-apple-system,Segoe UI,sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#f4f4f5;padding:32px 0;">
    <tr><td align="center">
      <table width="600" cellpadding="0" cellspacing="0" border="0" style="max-width:600px;width:100%;">
        <tr>
          <td style="background:linear-gradient(135deg,#0a0a0a 0%,#1a1a1a 100%);border-radius:12px 12px 0 0;padding:24px 32px;text-align:center;">
            <a href="${SITE_URL}" style="text-decoration:none;">${logoBlock()}</a>
          </td>
        </tr>
        <tr>
          <td style="background:#ffffff;padding:36px 40px 28px;border-left:1px solid #e5e5e5;border-right:1px solid #e5e5e5;">
            <h1 style="margin:0 0 20px;font-size:22px;font-weight:800;color:#0a0a0a;line-height:1.3;">${heading}</h1>
            <div style="font-size:15px;line-height:1.7;color:#374151;">${bodyHtml}</div>
            <div style="text-align:center;margin:28px 0 8px;">
              <a href="${btnUrl}" style="display:inline-block;background:#cc0000;color:#ffffff;text-decoration:none;font-size:15px;font-weight:700;padding:14px 32px;border-radius:8px;letter-spacing:0.3px;">${btnLabel}</a>
            </div>
          </td>
        </tr>
        <tr>
          <td style="background:#0a0a0a;border-radius:0 0 12px 12px;padding:20px 32px;text-align:center;">
            <p style="margin:0;font-size:12px;color:rgba(255,255,255,0.45);">
              © ${YEAR} <a href="${SITE_URL}" style="color:rgba(255,255,255,0.6);text-decoration:none;">${SITE}</a> &bull; Ezt az emailt automatikusan küldte a rendszer.
            </p>
          </td>
        </tr>
      </table>
    </td></tr>
  </table></body></html>`;
}

   <table style="width:100%;border-collapse:collapse;margin:16px 0;background:#f9f9f9;border-radius:8px;overflow:hidden;">
     <tr><td style="padding:12px 16px;font-size:13px;color:#6b7280;border-bottom:1px solid #eee;">Csomag</td><td style="padding:12px 16px;font-weight:700;color:#0a0a0a;border-bottom:1px solid #eee;">🥈 Ezüst</td></tr>
     <tr><td style="padding:12px 16px;font-size:13px;color:#6b7280;">Lejárat időpontja</td><td style="padding:12px 16px;font-weight:700;color:#0a0a0a;">2026. június 10. 15:59</td></tr>

     <tr><td style="padding:12px 16px;font-size:13px;color:#6b7280;border-bottom:1px solid #ffd5a0;">Csomag</td><td style="padding:12px 16px;font-weight:700;color:#0a0a0a;border-bottom:1px solid #ffd5a0;">🥈 Ezüst</td></tr>
